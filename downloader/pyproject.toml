[project]
name = "konmai-downloader"
version = "0.1.0"
description = "Fetches app releases from Google Play, GitHub and vendor APIs and hands them to the Konmai Backbone host"
license = "GPL-3.0-only"
requires-python = "==3.11.*"
dependencies = [
    "requests<2.26",
    "urllib3<1.26",
    "protobuf>=6,<7",
    "cryptography",
    "pydantic>=2",
]

[project.scripts]
konmai-downloader = "konmai_downloader.__main__:main"

[dependency-groups]
dev = ["pytest", "autopep8", "responses", "grpcio-tools"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `src/gpapi` is a thin shim whose package path also covers the untouched submodule in
# `googleplay-api/gpapi`; the protobuf module it needs is generated by scripts/generate_protobuf.py.
[tool.hatch.build.targets.wheel]
packages = ["src/konmai_downloader", "src/gpapi"]

[tool.autopep8]
max_line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
