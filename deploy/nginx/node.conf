# Reference nginx server block for a Konmai Backbone node. Adjust paths, server_name and the
# TLS lines to your setup; this file is documentation, nothing applies it automatically.
#
# Paths assumed below:
#   /srv/konmai/files   storageDirectory from node config.json (the agent writes /files/health)
#   127.0.0.1:5140      syslog address from node config.json (the agent listens here)

# The agent counts "bytes" of every line toward the node's bandwidth and "ip" toward the
# per-address statistics; the other fields are for people reading the log. $remote_addr is the
# client because users connect to the node directly; behind a proxy or CDN, set it with the
# realip module first.
log_format konmai_json escape=json
    '{"t":"$time_iso8601","ip":"$remote_addr","uri":"$request_uri","status":$status,'
    '"bytes":$bytes_sent,"rt":$request_time}';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name node1.example.com;

    ssl_certificate     /etc/ssl/konmai/fullchain.pem;
    ssl_certificate_key /etc/ssl/konmai/privkey.pem;

    sendfile on;
    tcp_nopush on;
    # Every byte this server sends is reported to the agent, whatever the path or status, which
    # turns it into bandwidth accounting.
    access_log syslog:server=127.0.0.1:5140,tag=konmai konmai_json;

    location /files/ {
        alias /srv/konmai/files/;
        add_header Cache-Control "public, max-age=3600";
        # In-progress downloads must never be served.
        location ~ \.part$ {
            return 404;
        }
    }

    location = /files/health {
        alias /srv/konmai/files/health;
        add_header Cache-Control "no-store";
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name node1.example.com;
    access_log syslog:server=127.0.0.1:5140,tag=konmai konmai_json;
    return 301 https://$host$request_uri;
}
