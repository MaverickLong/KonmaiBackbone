# Reference nginx server block for the Konmai Backbone host. Adjust paths, server_name and the
# TLS lines to your setup; this file is documentation, nothing applies it automatically.
#
# Paths assumed below:
#   /srv/konmai/app/dashboard/dist   built dashboard (yarn workspace konmai-dashboard build)
#   /srv/konmai/storage              storageDirectory from host config.json
#   127.0.0.1:3000                   listen address from host config.json

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cdn.example.com;

    ssl_certificate     /etc/ssl/konmai/fullchain.pem;
    ssl_certificate_key /etc/ssl/konmai/privkey.pem;

    client_max_body_size 2m;
    sendfile on;
    tcp_nopush on;

    # Dashboard (single page app).
    root /srv/konmai/app/dashboard/dist;
    location / {
        try_files $uri /index.html;
    }

    # Backend: download routing and JSON APIs.
    location ~ ^/(api|d)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The downloader talks to the backend directly on the loopback interface; never expose it.
    location /api/ingest/ {
        return 404;
    }

    # Node agents keep a WebSocket open here.
    location = /api/nodes/ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # App icons uploaded through the dashboard.
    location /icons/ {
        alias /srv/konmai/storage/icons/;
        expires 1h;
    }

    # Nodes pull releases from here with their enrollment token; nginx asks the backend whether
    # the token is valid before serving the file.
    location /store/ {
        auth_request /api/internal/node-auth;
        alias /srv/konmai/storage/store/;
    }
    location = /api/internal/node-auth {
        internal;
        proxy_pass http://127.0.0.1:3000;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # Target of X-Accel-Redirect when no node holds a file yet.
    location /internal/store/ {
        internal;
        alias /srv/konmai/storage/store/;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name cdn.example.com;
    return 301 https://$host$request_uri;
}
